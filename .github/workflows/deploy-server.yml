name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Server Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "server/**"
          target: "/root"

      - name: Restart C2-Dashboard via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/server
            npm install
            node -e "console.log(JSON.stringify(require('/root/server/data/users.json').map(u => ({ username: u.username, phone: u.phone, settings: u.settings })), null, 2))"
            pm2 restart C2-Dashboard --update-env || pm2 start index.js --name C2-Dashboard --update-env

